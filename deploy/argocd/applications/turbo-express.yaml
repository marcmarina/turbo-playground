apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: turbo-express
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/marcmarina/turbo-playground.git
    targetRevision: master
    path: apps/express/helm
    helm:
      releaseName: turbo-express
      valueFiles:
        - values.yaml
        - values-image.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Enable once the first diff/sync looks clean:
  # syncPolicy:
  #   automated:
  #     prune: true
  #     selfHeal: true
