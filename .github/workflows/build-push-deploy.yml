name: Build, Push, and Deploy

on:
  push:
    branches: ["master"]

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Copy build dependencies
        run: ./copy-build-deps.sh

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.marc-lab.dev
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push tagged image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: harbor.marc-lab.dev/library/turbo-playground:${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: harbor.marc-lab.dev/library/turbo-playground:latest

  update-image-tag:
    name: Update Express Image Tag
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-image-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set image tag
        run: yq -i '.image.tag = "${{ github.sha }}"' apps/express/helm/values-image.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/express/helm/values-image.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy turbo-express ${GITHUB_SHA::7}"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
