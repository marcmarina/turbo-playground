name: Build Preview Image

# Builds an image for PRs labelled "preview". The turbo-express-previews
# ApplicationSet in k3s-cluster deploys it to turbo-express-pr-<number>.marc-lab.dev.

on:
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened, labeled]

jobs:
  build-and-push:
    name: Build and Push Preview Image
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The PR's head commit, not the merge commit in github.sha: ArgoCD
      # deploys the head SHA, so the image tag has to match it
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Copy build dependencies
        run: ./copy-build-deps.sh

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.marc-lab.dev
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push preview image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: harbor.marc-lab.dev/library/turbo-playground:${{ github.event.pull_request.head.sha }}
