name: Build and Push

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "deploy/**"

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Copy build dependencies
        run: ./copy-build-deps.sh

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.marc-lab.dev
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Flux picks up the <run_number>-<sha> tag and commits it to deploy/.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            harbor.marc-lab.dev/library/turbo-playground:${{ github.run_number }}-${{ github.sha }}
            harbor.marc-lab.dev/library/turbo-playground:latest
