namespace: default

image:
  repository: harbor.marc-lab.dev/library/turbo-playground
  tag: latest
  pullPolicy: IfNotPresent

container:
  command: ["node", "apps/koa"]
  port: 8080

deployment:
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  preStop:
    delay: 5

resources:
  requests:
    cpu: 250m
    memory: 250Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  path: /_health

livenessProbe:
  path: /_health

service:
  type: ClusterIP
  port: 80

ingress:
  host: turbo-koa.marc-lab.dev

env:
 LOG_LEVEL: info
 LOG_FORMAT: json
 ENABLE_REQUEST_LOGGING: false
